name: Deploy to Strato (SFTP)

on:
  push:
    branches: [strato-migration]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dateien für den Upload vorbereiten
        run: |
          mkdir -p deploy
          cp index.html deploy/index.html
          cp migrate.html deploy/migrate.html
          cp apple-touch-icon.png deploy/apple-touch-icon.png
          cp icon-192.png deploy/icon-192.png
          cp icon-512.png deploy/icon-512.png
          sed \
            -e "s|DEIN_DB_HOST|${{ secrets.STRATO_DB_HOST }}|" \
            -e "s|DEIN_DB_NAME|${{ secrets.STRATO_DB_NAME }}|" \
            -e "s|DEIN_DB_USER|${{ secrets.STRATO_DB_USER }}|" \
            -e "s|DEIN_DB_PASSWORT|${{ secrets.STRATO_DB_PASS }}|" \
            api.php > deploy/api.php

      - name: Zielordner lehrgangsplaner anlegen
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -p "${{ secrets.STRATO_FTP_PASS }}" sftp -o StrictHostKeyChecking=no -P 22 "${{ secrets.STRATO_FTP_USER }}@${{ secrets.STRATO_FTP_HOST }}" <<'EOF'
          -mkdir lehrgangsplaner
          EOF

      - name: Upload per SFTP zu Strato
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.STRATO_FTP_HOST }}
          port: 22
          username: ${{ secrets.STRATO_FTP_USER }}
          password: ${{ secrets.STRATO_FTP_PASS }}
          local_path: ./deploy/*
          remote_path: ./lehrgangsplaner/
          sftp_only: true

      - name: Alte Dateien aus dem Hauptverzeichnis entfernen
        run: |
          sshpass -p "${{ secrets.STRATO_FTP_PASS }}" sftp -o StrictHostKeyChecking=no -P 22 "${{ secrets.STRATO_FTP_USER }}@${{ secrets.STRATO_FTP_HOST }}" <<'EOF'
          -rm index.html
          -rm api.php
          -rm migrate.html
          EOF
