<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Migration Firestore → MySQL</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; color: #2a241c; }
  h1 { font-size: 20px; }
  button { display: block; width: 100%; padding: 12px; margin: 10px 0; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 4px; border: 1px solid #1c2e22; background: #1c2e22; color: #f4ede0; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  pre { background: #f4ede0; padding: 12px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  .ok { color: #35603f; font-weight: 700; }
  .err { color: #7a3141; font-weight: 700; }
</style>
</head>
<body>

<h1>Einmalige Migration: Firestore → MySQL</h1>
<p>1. Erst Daten aus Firestore laden und prüfen. 2. Dann an die neue MySQL-Datenbank (<code>api.php</code> im selben Verzeichnis) übertragen.<br>
<strong>Diese Datei danach vom Server löschen</strong> – sie wird nur einmal gebraucht.</p>

<button id="loadBtn" onclick="loadFromFirestore()">1. Daten von Firestore laden</button>
<button id="migrateBtn" onclick="migrateToMysql()" disabled>2. Zu MySQL übertragen</button>

<div id="status"></div>
<pre id="preview"></pre>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBJHqNOJwr_g8-5qxysL-JH7ThGZR1QTw4",
  authDomain: "lehrgangsplaner-be70f.firebaseapp.com",
  projectId: "lehrgangsplaner-be70f",
  storageBucket: "lehrgangsplaner-be70f.firebasestorage.app",
  messagingSenderId: "791833075191",
  appId: "1:791833075191:web:fa50fcc9aa924625c9e2f2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let loadedState = null;

function setStatus(html) {
  document.getElementById('status').innerHTML = html;
}

async function loadFromFirestore() {
  setStatus('Lade von Firestore …');
  try {
    const doc = await db.collection('lehrgangsplaner').doc('state').get();
    const data = doc.exists ? doc.data() : null;
    loadedState = (data && Array.isArray(data.courses)) ? data : { courses: [] };
    document.getElementById('preview').textContent = JSON.stringify(loadedState, null, 2);
    setStatus(`<span class="ok">${loadedState.courses.length} Lehrgang/Lehrgänge geladen.</span> Bitte oben prüfen, dann Schritt 2 ausführen.`);
    document.getElementById('migrateBtn').disabled = false;
  } catch (e) {
    setStatus(`<span class="err">Fehler beim Laden von Firestore: ${e.message}</span>`);
  }
}

async function migrateToMysql() {
  if (!loadedState) return;
  setStatus('Übertrage zu MySQL …');
  try {
    const res = await fetch('api.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(loadedState)
    });
    const result = await res.json();
    if (!res.ok || !result.ok) throw new Error(result.error || ('HTTP ' + res.status));
    setStatus(`<span class="ok">Erfolgreich in MySQL gespeichert.</span> Du kannst diese Datei jetzt vom Server löschen und zur neuen index.html wechseln.`);
  } catch (e) {
    setStatus(`<span class="err">Fehler beim Übertragen zu MySQL: ${e.message}</span> Prüfe die Zugangsdaten in api.php.`);
  }
}
</script>
</body>
</html>
